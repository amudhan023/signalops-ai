global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The simulator, running on the host outside this stack.
  # Alertmanager groups on `tenant` and `service`, so every alert needs both.
  # The simulator labels its own payment_* series. The target labels below
  # cover the rest -- `up`, process_*, python_gc_* -- so SimulatorDown is
  # routable too. honor_labels keeps the simulator's own values when both
  # are set, instead of renaming them to exported_tenant/exported_service.
  - job_name: simulator
    honor_labels: true
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          tenant: acme
          service: payment-api

  # sigops-sim-service (checkout-api), started from the Control Plane's
  # Simulate page. Same label rules as the simulator job above.
  - job_name: sigops-sim
    honor_labels: true
    static_configs:
      - targets: ["host.docker.internal:8200"]
        labels:
          tenant: acme
          service: checkout-api
