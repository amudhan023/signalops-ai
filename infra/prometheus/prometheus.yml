global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Your simulator, running on the host outside this stack.
  # It must label its metrics with `tenant` and `service` — Alertmanager
  # groups on those two labels and they have to be present on the alert.
  - job_name: simulator
    static_configs:
      - targets: ["host.docker.internal:8000"]
